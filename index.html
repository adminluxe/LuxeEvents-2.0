    <meta name="description" content="LuxeEvents — Agence d’événements haut de gamme. Expériences sur-mesure, exécution impeccable, sens aigu du détail."/>
    <meta property="og:title" content="LuxeEvents — L’art de l’événement"/>

    <!-- Fond + styles (cache-bust v=2) -->
    <link rel="preload" as="image" href="/bg-luxeevents.png"/>
    <link rel="stylesheet" href="/app.css?v=7"/>

    <!-- Thème (light/dark) init très simple -->
    <script>
      try{
        const k="theme";
        let t=localStorage.getItem(k);
        if(!t){ t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.dataset.theme=t;
      }catch{}
    </script>
    <script type="module" src="/src/pwa-register.js"></script>
</head>
